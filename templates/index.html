{% extends "base.html" %}
{% block content %}
<section class="card">
  <h2>Generează întrebări</h2>
  <form method="post" action="{{ url_for('generate') }}">
    <label for="n">Număr întrebări</label>
    <input type="number" id="n" name="n" min="1" max="20" value="5" required>
    
    <label>Selectează Capitole / Tipuri de probleme:</label>
    <div>
        <input type="checkbox" name="topics" value="n-queens" checked> N-Queens (CSP/Search)<br>
        <input type="checkbox" name="topics" value="generalized hanoi" checked> Hanoi (Search/Recursion)<br>
        <input type="checkbox" name="topics" value="graph coloring" checked> Graph Coloring (CSP)<br>
        <input type="checkbox" name="topics" value="knight's tour" checked> Knight's Tour (Heuristic Search)
    </div>
    
    <button type="submit" class="btn">Generează Test</button>
  </form>
  <p class="hint">Acoperă: n-queens, Hanoi generalizat, colorare graf, knight’s tour.</p>
</section>
{% endblock %}
